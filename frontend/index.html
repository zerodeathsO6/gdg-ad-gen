<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guwahati Brand Hijacker</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@1/css/pico.min.css">
</head>

<body class="container" style="padding-top: 50px;">

    <h1>💡 The 'Brand Hijack' Agency</h1>

    <label for="brandName">What local brand are we hijacking?</label>
    <input type="text" id="brandName" placeholder="e.g., JB's Momo Stall...">

    <label for="toneSelect">Choose the strategy:</label>
    <select id="toneSelect">
        <option value="Pure Sarcasm">Pure Sarcasm</option>
        <option value="Overly Dramatic">Overly Dramatic</option>
    </select>

    <button id="submitBtn" onclick="runCampaign()">Launch Campaign 🚀</button>

    <hr>

    <h3 id="loadingText" style="display:none; color: orange;">Brewing Assam tea and writing copy...</h3>
    <div id="outputBox" style="display:none; padding: 20px; background: #232d38; border-radius: 8px;">
        <h4>📋 Your Generated Campaign:</h4>
        <p id="campaignResult" style="white-space: pre-wrap;"></p>
    </div>

    <script>
        async function runCampaign() {
            const brand = document.getElementById('brandName').value;
            const tone = document.getElementById('toneSelect').value;

            if (!brand) {
                alert("Please type a brand name!");
                return;
            }

            // Show loading indicators
            document.getElementById('loadingText').style.display = 'block';
            document.getElementById('outputBox').style.display = 'none';

            try {
                // Send the POST request to your local Python backend server which you need to run using uvicorn
                const response = await fetch('http://127.0.0.1:8000/generate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ brand_name: brand, tone: tone })
                });

                const result = await response.json();

                if (result.success) {
                    // Update the HTML text smoothly
                    document.getElementById('campaignResult').innerText = result.data;
                    document.getElementById('outputBox').style.display = 'block';
                } else {
                    alert("Error: " + result.detail);
                }
            } catch (error) {
                alert("Could not connect to Python backend server: " + error);
            } finally {
                // Hide loading spinner
                document.getElementById('loadingText').style.display = 'none';
            }
        }
    </script>
</body>

</html>
